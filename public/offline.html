<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#EEEDE8">
    <title>You're offline</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
               font-family: Manrope, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
               background: #EEEDE8; color: #20241F; text-align: center; }
        .card { max-width: 360px; background: #fff; border-radius: 28px; padding: 32px 24px; box-shadow: 0 1px 2px rgba(32,36,31,.06); }
        img { width: 64px; height: 64px; border-radius: 16px; }
        h1 { font-size: 20px; margin: 20px 0 8px; }
        p { margin: 0 0 24px; color: #6b6f68; font-size: 14px; line-height: 1.5; }
        button { border: 0; border-radius: 999px; background: #F4B400; color: #20241F; font: inherit; font-weight: 700; padding: 12px 24px; font-size: 15px; }
        @media (prefers-color-scheme: dark) {
            body { background: #0F100D; color: #F5F5F0; }
            .card { background: #1B1D19; }
            p { color: #a3a69f; }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Check your internet connection, then try again. Your work is saved on the server, so nothing is lost.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
